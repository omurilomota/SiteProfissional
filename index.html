<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <title>Murilo — Desenvolvedor em formação</title>
    <meta
      name="description"
      content="Desenvolvedor em formação, com foco em backend, aplicações web e bancos de dados. Projetos práticos em Java e Spring Boot."
    />
    <meta name="author" content="Murilo" />

    <!--
      OpenGraph: como o link aparece no WhatsApp e no LinkedIn.
      Depois do deploy, troque "/og-image.png" pela URL absoluta
      (https://seu-endereco/og-image.png). Alguns coletores de preview não
      resolvem caminho relativo e mostrariam o cartão sem imagem.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Murilo" />
    <meta property="og:title" content="Murilo — Desenvolvedor em formação" />
    <meta
      property="og:description"
      content="Projetos práticos em Java e Spring Boot. Em busca de uma oportunidade de estágio em desenvolvimento de software."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Murilo — Desenvolvedor em formação" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Murilo — Desenvolvedor em formação" />
    <meta
      name="twitter:description"
      content="Projetos práticos em Java e Spring Boot. Em busca de uma oportunidade de estágio em desenvolvimento de software."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!--
      O domínio próprio entra aqui quando existir (mantenha no deploy).
      <link rel="canonical" href="https://seu-endereco.vercel.app/" />
    -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
